<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/poll-form.css">
    <title>Document</title>
</head>
<body>
    <main>
         <div>
            <h1>Contact Information</h1>
            <form>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" required>
            </form>
        </div>

         <div>
            <h1>Questions</h1>
            <form >
              <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            
            <label for="browser">What is your Favorite Browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">FireFox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Others</option>
            </select>
            
            <label for="pet">Do you have a household pet?</label>
            <input type="text" id="pet" name="pet">

             <label for="feedback">List the places you have lived</label>

             <textarea name="feeback" id="feedback" rows="4" placeholder="Stillwater Florida," Amsterdam Netherlands, Timbuktu mali></textarea>
             <button type="submit">Submit Poll</button>
            
            </form>
        </div>

          
      
    </main>
</body>
</html>
