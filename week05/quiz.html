<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="./styles/quiz.css">
</head>
<body>
    <main class="box">
        <h1>✅ Basic html and css quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does the acronym css Stands for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">2. How are id and class attributes selected in css?</label>
                <textarea type="text" id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. which of the following is a valid Css Comment?</label>
                <select id="q3" name="q3" >
                    <option value="choose one" selected disabled></option>
                    <option value="a">A. &lt;!-- This is a comment -- &lt;</option>
                    <option value="b">B. /* This is a comment*/</option>
                    <option value="c">C. // This is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <code class="box">Margin: 10px 5px 15px</code>
                <input type="number" id="q4" name="q4" >
            </div>

    
             <button type="submit">Submit Quiz</button>
        

        </form>
    </main>
    
</body>
</html>
