<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Hiko World Rafting in Freetown, Sierra Leone. Get in touch for booking inquiries, questions about our rafting trips, or general information about our services.">
    <meta name="author" content="Colebay Kaps Kamanda">
    <title>Contact Us | Hiko World Rafting</title>
    <link rel="stylesheet" href="./styles/rafting.css">
</head>
<body>
    <header>
        <div id="logo">
            <img src="./images/wwr-logo.png" alt="White Water Rafting Logo">
        </div>
        <nav class="references">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Company Information Section -->
        <section class="company-info">
            <h1>Contact Us</h1>
            <div class="contact-details">
                <div class="address">
                    <h2>📍 Our Location</h2>
                    <p>Hiko World Rafting<br>
                    123 River Road, Freetown<br>
                    Sierra Leone, West Africa</p>
                    <p><strong>Phone:</strong> +232 76 123 456<br>
                    <strong>Email:</strong> info@hikoworld.com</p>
                </div>
                <div class="map">
                    <h2>Find Us</h2>
                    <!-- Google Map Embed -->
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.5!2d-13.2!3d8.5!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zOMKwMzAnMDAuMCJOIDEzwrAxMicwMC4wIlc!5e0!3m2!1sen!2ssl!4v1234567890" 
                    width="100%" 
                    height="300" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </section>

        <!-- Employee Profiles Section -->
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="./images/employee1.jpg" alt="John Doe - Lead Guide">
                    <figcaption><strong>John Doe</strong><br>Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="./images/employee2.jpg" alt="Jane Smith - Safety Officer">
                    <figcaption><strong>Jane Smith</strong><br>Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="./images/employee3.jpg" alt="Mike Johnson - Trip Coordinator">
                    <figcaption><strong>Mike Johnson</strong><br>Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- Contact Form Section -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <!-- Name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <!-- Purpose (Radio Buttons) -->
                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <!-- Message -->
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Newsletter Checkbox -->
                <label>
                    <input type="checkbox" name="newsletter" value="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <!-- Submit Button -->
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©️2026 😍Hiko World😍 Colebay Kaps Kamanda</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="./images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="./images/linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="./images/instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
